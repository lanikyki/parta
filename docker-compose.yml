# Всё на одном сервере (VPS с Linux): сайт + видеосервер LiveKit + HTTPS через Caddy.
# Перед запуском: скопируйте .env.example в .env и заполните значения (см. README, вариант Б).
# Запуск: docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      LIVEKIT_PUBLIC_URL: wss://${LIVEKIT_DOMAIN}
    network_mode: host
    volumes:
      - ./data:/app/data

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}'
    network_mode: host
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN}
    network_mode: host
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
