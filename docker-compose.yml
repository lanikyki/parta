# Всё на одном сервере (VPS с Linux): сайт + видеосервер LiveKit + HTTPS через Caddy.
# Проще всего запустить так: sudo bash deploy/setup.sh — скрипт сам заполнит .env и всё запустит.
# Вручную: скопируйте .env.example в .env, заполните значения (README, вариант Б) и выполните docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Браузеры подключаются к видео через Caddy по HTTPS, а сам сайт — напрямую, внутри сервера
      LIVEKIT_PUBLIC_URL: wss://${LIVEKIT_DOMAIN}
      LIVEKIT_URL: ws://127.0.0.1:7880
    # Сайт слушает только внутри сервера: снаружи в него попадают через Caddy (HTTPS)
    command: ['node_modules/.bin/next', 'start', '-H', '127.0.0.1', '-p', '3000']
    network_mode: host
    volumes:
      - ./data:/app/data

  livekit:
    # Версия зафиксирована: при пересборке сайта видеосервер не обновится сам по себе.
    # Новую версию (github.com/livekit/livekit/releases) ставим вручную: меняем тег, проверяем пробный урок.
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}'
    network_mode: host
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN}
    network_mode: host
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
